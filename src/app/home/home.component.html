<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .hero {
            text-align: center;
            padding: 50px;
            background-color: #007bff;
            color: white;
        }

        .card {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="hero">
        <h1>Bienvenue sur mon Portfolio</h1>
        <p>Découvrez mes projets récents</p>
    </div>

    <div class="container">
        <h2 class="my-4">Mes Projets</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <img class="card-img-top" src="image1.jpg" alt="Image projet 1">
                    <div class="card-body">
                        <h5 class="card-title">Projet 1</h5>
                        <p class="card-text">Description du projet 1</p>
                        <a href="https://exemple-projet1.com" class="btn btn-primary" target="_blank">Voir le projet</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <img class="card-img-top" src="image2.jpg" alt="Image projet 2">
                    <div class="card-body">
                        <h5 class="card-title">Projet 2</h5>
                        <p class="card-text">Description du projet 2</p>
                        <a href="https://exemple-projet2.com" class="btn btn-primary" target="_blank">Voir le projet</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <img class="card-img-top" src="image3.jpg" alt="Image projet 3">
                    <div class="card-body">
                        <h5 class="card-title">Projet 3</h5>
                        <p class="card-text">Description du projet 3</p>
                        <a href="https://exemple-projet3.com" class="btn btn-primary" target="_blank">Voir le projet</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>

</html>
